# ChatGPT half of the two-model source check (the Claude Haiku half runs in the research
# routine; see docs/headline-checks/tasks/research.md). On a pull request that touches a
# check, sends each new or edited source to a small OpenAI model, commits the results to
# the check's verification.chatgpt blocks and comments a summary on the PR.
#
# OFF by default: runs only when the repo variable SOURCE_CHECK_CHATGPT is "on".
# Billed to the OPENAI_API_KEY repo secret. Caps: 12 sources per run, about 3,000 input
# and 300 output tokens per source (cost estimate in docs/headline-checks/PIPELINE.md).
# Same-repo branches only: forks get no secrets and can't be pushed to.
# The results commit is pushed with GITHUB_TOKEN, which does not start new workflow runs,
# so it does not loop or re-trigger the paid AI code review.
name: Source check (ChatGPT)

on:
  pull_request:
    paths:
      - 'src/content/reality-check/checks/**'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: source-check-chatgpt-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  check:
    if: vars.SOURCE_CHECK_CHATGPT == 'on' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Ask ChatGPT about each new or edited source
        id: files
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # NUL-delimited into an array, so any file name stays one argument.
          mapfile -d '' files < <(git diff -z --name-only --diff-filter=AM "$BASE_SHA"...HEAD -- 'src/content/reality-check/checks/*.mdx')
          if [ "${#files[@]}" -eq 0 ]; then echo "No changed checks."; echo "files=" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "files=yes" >> "$GITHUB_OUTPUT"
          node scripts/checks/source-check-chatgpt.mjs --write --comment "$RUNNER_TEMP/comment.md" -- "${files[@]}"
      - name: Commit results to the PR branch
        if: steps.files.outputs.files != ''
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- src/content/reality-check/checks; then echo "No new results to commit."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/reality-check/checks
          git commit -m "Source check: ChatGPT results"
          git push origin "HEAD:refs/heads/$HEAD_REF"
      - name: Comment on the PR
        if: steps.files.outputs.files != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md" --edit-last 2>/dev/null \
            || gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"
